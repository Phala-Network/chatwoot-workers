name: Scorecard

on:
  # For the Branch-Protection check (default branch only).
  branch_protection_rule:
  # Keeps the Maintained check up to date.
  schedule:
    - cron: "33 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # publish_results only works from the default branch of a public repository.
    if: ${{ !github.event.repository.private && github.event.repository.default_branch == github.ref_name }}
    permissions:
      # Upload results to code scanning.
      security-events: write
      # Publish results to the OpenSSF API (needed for the badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
